audio:
  format: m4a
  sample_rate: 16000
  channels: 1
  codec: aac
  quality: 192k

download:
  max_retries: 3
  retry_delay: 5
  timeout: 300
  
whisper:
  model: base
  language: es
  word_timestamps: true
  task: transcribe
  fp16: false
  beam_size: 5
  best_of: 5
  temperature: 0.0
  device: cuda
  partial_duration: 45

alignment:
  min_similarity: 0.7
  aeneas_task_language: spa
  aeneas_is_text_type: plain
  window_size: 50
  min_match_length: 30
  wer_threshold: 0.5
  char_similarity_threshold: 0.6

modules:
  books-eater:
    excel_path: audio_processing/data/dominican_audiobooks.xlsx
    url_column: "URL YouTube"
    audio_dir: books-eater/audio
    transcriptions_dir: books-eater/transcriptions
    reports_dir: books-eater/reports
    reference_texts_dir: books-eater/reference_texts
    alignments_dir: books-eater/alignments
    
  poems-eater:
    excel_path: audio_processing/data/dominican_poems.xlsx
    url_column: "URL YouTube"
    audio_dir: poems-eater/audio
    transcriptions_dir: poems-eater/transcriptions
    reports_dir: poems-eater/reports
    reference_texts_dir: poems-eater/reference_texts
    alignments_dir: poems-eater/alignments
    
  lyrics-eater:
    excel_path: audio_processing/data/dominican_lyrics-eater.xlsx
    url_column: "enlace_youtube"
    # Optional column containing a stable id (e.g. youtube id). If absent, extractor will parse the id from the URL.
    # id_column: "youtube_id"
    lyrics_column: "letras"
    audio_dir: lyrics-eater/audio
    transcriptions_dir: lyrics-eater/transcriptions
    alignments_dir: lyrics-eater/alignments
    reports_dir: lyrics-eater/reports
    reference_texts_dir: lyrics-eater/reference_texts
